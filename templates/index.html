<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LYNE HOSTING</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 24px;
      background: #0b1020; color: #f4f7ff;
      font-family: Arial, sans-serif;
    }
    .container { max-width: 900px; margin: auto; }
    header { padding: 20px 0; border-bottom: 1px solid #28334c; }
    h1 { color: #8b9cff; margin-bottom: 8px; }
    .card {
      background: #151d32; border: 1px solid #293652;
      border-radius: 16px; padding: 22px; margin-top: 22px;
    }
    .status { color: #ffd166; }
    .button {
      display: inline-block; background: #697cff; color: white;
      padding: 12px 18px; border-radius: 9px;
      text-decoration: none; border: 0;
    }
    p { line-height: 1.6; color: #c2cbe0; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>LYNE HOSTING</h1>
      <p>Your Python hosting dashboard</p>
    </header>
    <div class="card">
      <h2>Welcome to LYNE HOSTING</h2>
      <p>Upload and manage your Python projects from one place.</p>
      <p class="status">● Hosting system: Development mode</p>
      <p>Script runner: Coming soon</p>
      <p>Account system: Coming soon</p>
      <a class="button" href="/health">Check server</a>
    </div>
  </div>
</body>
</html>
